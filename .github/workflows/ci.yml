name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck and shfmt
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck shfmt
      - name: shellcheck
        run: make lint
      - name: shfmt
        run: make format-check

  unit:
    name: unit tests (Ubuntu ${{ matrix.release }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        release: ["24.04", "26.04"]
    # GitHub's runners are virtual machines, and each job runs in a fresh
    # container on top: nothing here touches a contributor's computer.
    container: ubuntu:${{ matrix.release }}
    steps:
      - name: Install test dependencies
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            bash ca-certificates coreutils git jq procps python3 systemd util-linux
      - uses: actions/checkout@v4
      # Domovyk runs as a regular user, so the tests do too.
      - name: Create a test user
        run: |
          useradd --create-home --shell /bin/bash tester
          chown -R tester: "$GITHUB_WORKSPACE"
      - name: Unit and property tests
        run: su tester -c 'cd "$GITHUB_WORKSPACE" && test/unit/run'
